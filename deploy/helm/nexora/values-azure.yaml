secrets:
  name: nexora-runtime

postgres:
  serviceName: postgres
  port: 5432
  database: postgres
  persistence:
    claimName: nexora-azure-postgres-data
    size: 5Gi
    storageClassName: local-path

replicas:
  frontend: 1

images:
  pullPolicy: IfNotPresent
  postgres: postgres:17.11-alpine3.24
  userService: manuraj05/nexora-user-service:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  productService: manuraj05/nexora-product-service:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  orderService: manuraj05/nexora-order-service:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  reconciliationWorker: manuraj05/nexora-order-reconciliation-worker:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  apiGateway: manuraj05/nexora-api-gateway:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  frontend: manuraj05/nexora-frontend:a8f35a99c6e5da113fbef15b16394dbfc2fc5164
  
ingress:
  enabled: true
  className: traefik