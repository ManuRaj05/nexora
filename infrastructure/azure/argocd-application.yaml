apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexora
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ManuRaj05/nexora.git
    targetRevision: main
    path: deploy/helm/nexora
    helm:
      valueFiles:
        - values-azure.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nexora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
