
name: Build and Push Nexora Images

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            manuraj05/nexora-frontend:latest
            manuraj05/nexora-frontend:${{ github.sha }}

      - name: Build and push API gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: true
          tags: |
            manuraj05/nexora-api-gateway:latest
            manuraj05/nexora-api-gateway:${{ github.sha }}

      - name: Build and push user service
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-service
          push: true
          tags: |
            manuraj05/nexora-user-service:latest
            manuraj05/nexora-user-service:${{ github.sha }}

      - name: Build and push product service
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: true
          tags: |
            manuraj05/nexora-product-service:latest
            manuraj05/nexora-product-service:${{ github.sha }}

      - name: Build and push order service
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: true
          tags: |
            manuraj05/nexora-order-service:latest
            manuraj05/nexora-order-service:${{ github.sha }}

      - name: Build and push reconciliation worker
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: true
          tags: |
            manuraj05/nexora-order-reconciliation-worker:latest
            manuraj05/nexora-order-reconciliation-worker:${{ github.sha }}

      - name: Update Helm image tags for GitOps
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s#(manuraj05/nexora-(frontend|api-gateway|user-service|product-service|order-service|order-reconciliation-worker)):[^[:space:]]+#\1:${IMAGE_TAG}#g" \
            deploy/helm/nexora/values-azure.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/helm/nexora/values-azure.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): deploy images ${IMAGE_TAG}"
            git push
          else
            echo "Image tags are already up to date."
          fi
